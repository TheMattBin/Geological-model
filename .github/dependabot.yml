version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    # Ranges already permit current releases; preserve the deliberately tested minimums.
    # This disables routine version PRs, not Dependabot security updates.
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
